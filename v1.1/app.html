.table-responsive &gt; .table :is(th, td) {

  z-index: 50;
  top: 0;
  left: 0;

  background: var(--popover);

  pointer-events: none;
  user-select: none;

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.text-muted {

}

.sr-only {

  height: 1px;

  overflow: hidden;
  clip: rect(0, 0, 0, 0);

.viz-controls {

  align-items: center;

.btn {

  margin-bottom: 6px;

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          : facility.type === &#39;内墙&#39;

            : facility.type === &#39;卫生间&#39;

  function saveFacilityRecord() {
    const name = document.getElementById(&#39;facility-name&#39;).value.trim();
    const detail = document.getElementById(&#39;facility-detail&#39;).value.trim();
    const error = document.getElementById(&#39;facility-error&#39;);
    if (!name) { error.textContent = &#39;请填写档案名称。&#39;; error.hidden = false; return; }
    const type = document.getElementById(&#39;facility-type&#39;).value;
    const isDoor = type === &#39;门&#39;;
    const isWindow = type === &#39;窗&#39;;
    const isWaterproof = type === &#39;防水&#39;;
    const isExteriorWall = type === &#39;外墙&#39;;
    const isInteriorWall = type === &#39;内墙&#39;;
    const isSanitaryRoom = type === &#39;卫生间&#39;;
    const isBathroom = type === &#39;浴室&#39;;
    const isFireFacility = type === &#39;消防设施&#39;;
    const yearText = document.getElementById(&#39;facility-year&#39;).value.trim();
    const currentYear = new Date().getFullYear();
    if (yearText &amp;&amp; (!Number.isInteger(Number(yearText)) || Number(yearText) &lt; 1900 || Number(yearText) &gt; currentYear + 1)) {
      error.textContent = `最近改造年份请输入 1900—${currentYear + 1} 的四位整数。`;
      error.hidden = false;
      return;
    }
    const locationFields = [
      [isDoor, &#39;facility-door-location&#39;, &#39;门所在位置&#39;], [isWindow, &#39;facility-window-location&#39;, &#39;窗所在位置&#39;],
      [isExteriorWall, &#39;facility-exterior-location&#39;, &#39;外墙所在位置&#39;], [isInteriorWall, &#39;facility-interior-location&#39;, &#39;内墙所在位置&#39;],
      [isSanitaryRoom, &#39;facility-sanitary-location&#39;, &#39;卫生间所在位置&#39;], [isBathroom, &#39;facility-bathroom-location&#39;, &#39;浴室所在位置&#39;],
      [isFireFacility, &#39;facility-fire-location&#39;, &#39;消防设施设置位置&#39;]
    ];
    const invalidLocation = locationFields.find(([active, id]) =&gt; active &amp;&amp; document.getElementById(id).value.trim().length &gt; 100);
    if (invalidLocation) { error.textContent = `${invalidLocation[2]}不能超过 100 个字符。`; error.hidden = false; return; }
    const validatePositiveInteger = (active, id, label, maximum = Number.MAX_SAFE_INTEGER) =&gt; {
      const value = document.getElementById(id).value.trim();
      if (active &amp;&amp; value &amp;&amp; (!Number.isInteger(Number(value)) || Number(value) &lt; 1 || Number(value) &gt; maximum)) {
        error.textContent = `${label}请输入 1—${maximum === Number.MAX_SAFE_INTEGER ? &#39;9999&#39; : maximum} 的整数。`;
        error.hidden = false;
        return false;
      }
      return true;
    };
    if (!validatePositiveInteger(isDoor, &#39;facility-door-count&#39;, &#39;门数量&#39;, 9999)
      || !validatePositiveInteger(isWindow, &#39;facility-window-count&#39;, &#39;窗数量&#39;, 9999)
      || !validatePositiveInteger(isBathroom, &#39;facility-shower-count&#39;, &#39;淋浴位数量&#39;, 9999)
      || !validatePositiveInteger(isFireFacility, &#39;facility-fire-quantity&#39;, &#39;消防设施数量&#39;, 9999)) return;
    const validateArea = (active, id, label) =&gt; {
      const value = document.getElementById(id).value.trim();
      if (active &amp;&amp; value &amp;&amp; (!/^\d+(\.\d{1,2})?$/.test(value) || Number(value) &lt;= 0)) {
        error.textContent = `${label}请输入大于 0 且最多两位小数的数值。`;
        error.hidden = false;
        return false;
      }
      return true;
    };
    if (!validateArea(isWaterproof, &#39;facility-waterproof-area&#39;, &#39;防水面积&#39;)
      || !validateArea(isSanitaryRoom, &#39;facility-sanitary-area&#39;, &#39;卫生间建筑面积&#39;)
      || !validateArea(isBathroom, &#39;facility-bathroom-area&#39;, &#39;浴室建筑面积&#39;)) return;
    const thicknessText = document.getElementById(&#39;facility-insulation-thickness&#39;).value.trim();
    if (isExteriorWall &amp;&amp; thicknessText &amp;&amp; (!Number.isInteger(Number(thicknessText)) || Number(thicknessText) &lt; 0)) {
      error.textContent = &#39;保温厚度请输入不小于 0 的整数。&#39;; error.hidden = false; return;
    }
    const fireCategory = document.getElementById(&#39;facility-fire-category&#39;).value;
    if (isFireFacility &amp;&amp; !fireCategory) { error.textContent = &#39;请选择消防设施类别。&#39;; error.hidden = false; return; }
    const numberOrNull = id =&gt; { const value = document.getElementById(id).value.trim(); return value ? Number(value) : null; };
    const payload = {
      type,
      name,
      status: document.getElementById(&#39;facility-status&#39;).value,
      year: yearText ? Number(yearText) : null,
      doorType: isDoor ? document.getElementById(&#39;facility-door-type&#39;).value : &#39;&#39;,
      doorLocation: isDoor ? document.getElementById(&#39;facility-door-location&#39;).value.trim() : &#39;&#39;,
      doorCount: isDoor ? numberOrNull(&#39;facility-door-count&#39;) : null,
      doorHardwareStatus: isDoor ? document.getElementById(&#39;facility-door-hardware-status&#39;).value : &#39;&#39;,
      windowType: isWindow ? document.getElementById(&#39;facility-window-type&#39;).value : &#39;&#39;,
      frameMaterial: isWindow ? document.getElementById(&#39;facility-frame-material&#39;).value : &#39;&#39;,
      glassType: isWindow ? document.getElementById(&#39;facility-glass-type&#39;).value : &#39;&#39;,
      windowLocation: isWindow ? document.getElementById(&#39;facility-window-location&#39;).value.trim() : &#39;&#39;,
      windowCount: isWindow ? numberOrNull(&#39;facility-window-count&#39;) : null,
      windowHardwareStatus: isWindow ? document.getElementById(&#39;facility-window-hardware-status&#39;).value : &#39;&#39;,
      windowSealingPerformance: isWindow ? document.getElementById(&#39;facility-window-sealing-performance&#39;).value : &#39;&#39;,
      waterproofLocation: isWaterproof ? document.getElementById(&#39;facility-waterproof-location&#39;).value : &#39;&#39;,
      waterproofMaterial: isWaterproof ? document.getElementById(&#39;facility-waterproof-material&#39;).value : &#39;&#39;,

<script id="versioned-workbench-router-v1">
(() => {
  const frame = document.querySelector('iframe');
  if (!frame) return;
  const parameters = new URLSearchParams(location.search);
  const portalParameter = parameters.get('portal');
  const requestedView = parameters.get('view');
  const portal = portalParameter === 'bureau' ? 'bureau' : 'school';
  const shouldOpenProject = requestedView === 'project' || (!requestedView && Boolean(portalParameter));
  const projectUrl = targetPortal => {
    const url = new URL('./project.html', location.href);
    url.searchParams.set('portal', targetPortal === 'bureau' ? 'bureau' : 'school');
    return url.href;
  };
  const workbenchUrl = targetPortal => {
    const url = new URL('./app.html', location.href);
    url.searchParams.set('view', 'workbench');
    url.searchParams.set('portal', targetPortal === 'bureau' ? 'bureau' : 'school');
    return url.href;
  };
  if (shouldOpenProject) {
    location.replace(projectUrl(portal));
    return;
  }
  let activePortal = portal;
  let ready = false;
  const reveal = () => {
    frame.contentWindow?.postMessage({ type: 'set-portal', portal: activePortal }, '*');
    if (!ready) {
      ready = true;
      requestAnimationFrame(() => document.body.classList.add('route-ready'));
    }
  };
  frame.addEventListener('load', reveal);
  if (frame.contentDocument?.readyState === 'complete' || frame.contentDocument?.readyState === 'interactive') reveal();
  setTimeout(reveal, 0);
  setTimeout(reveal, 120);
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow) return;
    if (event.data?.type === 'open-project-management') {
      activePortal = event.data.portal === 'bureau' ? 'bureau' : 'school';
      location.assign(projectUrl(activePortal));
      return;
    }
    if (event.data?.type === 'project-back') {
      activePortal = event.data.portal === 'bureau' ? 'bureau' : 'school';
      location.assign(workbenchUrl(activePortal));
    }
  });
})();
</script>
