.table-responsive &gt; .table :is(th, td) {

  z-index: 50;
  top: 0;
  left: 0;

  background: var(--popover);

  pointer-events: none;
  user-select: none;

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.text-muted {

}

.sr-only {

  height: 1px;

  overflow: hidden;
  clip: rect(0, 0, 0, 0);

.viz-controls {

  align-items: center;

.btn {

  margin-bottom: 6px;

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  function renderVenueList(type) {

      + `&lt;section class=&quot;card list-card&quot;&gt;&lt;div class=&quot;toolbar&quot;&gt;&lt;div class=&quot;toolbar-group&quot;&gt;&lt;input class=&quot;form-control&quot; id=&quot;venue-search&quot; aria-label=&quot;搜索档案或学校&quot; placeholder=&quot;搜索档案或学校&quot; value=&quot;${state.keyword}&quot;&gt;${bureauFilters}&lt;select class=&quot;form-select&quot; id=&quot;status-filter&quot; aria-label=&quot;按使用状态筛选&quot;&gt;&lt;option value=&quot;&quot;&gt;全部使用状态&lt;/option&gt;&lt;option${state.usageFilter === &#39;使用中&#39; ? &#39; selected&#39; : &#39;&#39;}&gt;使用中&lt;/option&gt;&lt;option${state.usageFilter === &#39;改造中&#39; ? &#39; selected&#39; : &#39;&#39;}&gt;改造中&lt;/option&gt;&lt;option${state.usageFilter === &#39;闲置&#39; ? &#39; selected&#39; : &#39;&#39;}&gt;闲置&lt;/option&gt;&lt;/select&gt;${hasFilter ? &#39;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-reset-filter&gt;重置筛选&lt;/button&gt;&#39; : &#39;&#39;}&lt;/div&gt;&lt;/div&gt;${renderSchoolAreaProfile(type)}${venueTable(data)}&lt;div class=&quot;list-footer&quot;&gt;&lt;div class=&quot;pagination&quot;&gt;&lt;button class=&quot;btn page-button&quot; disabled aria-label=&quot;上一页&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;btn btn-primary page-button&quot; aria-current=&quot;page&quot;&gt;1&lt;/button&gt;&lt;button class=&quot;btn page-button&quot; disabled aria-label=&quot;下一页&quot;&gt;›&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;
  }

  const schoolStatisticsHeaders = [&#39;学校名称&#39;, &#39;学校总面积&#39;, &#39;学校租用面积&#39;, &#39;学校自有面积&#39;, &#39;学校建筑数量&#39;, &#39;学校建筑总面积&#39;, &#39;学校操场数量&#39;, &#39;学校操场总面积&#39;];
  const schoolStatisticsPageSize = 10;

  function schoolStatisticsRows() {
    const schools = [...new Set([...venues.map(venue =&gt; venue.school), ...Object.keys(schoolAreaProfiles)].filter(Boolean))].sort((a, b) =&gt; a.localeCompare(b, &#39;zh-CN&#39;));
    const keyword = state.schoolStatsKeyword.trim();
    return (keyword ? schools.filter(school =&gt; school.includes(keyword)) : schools).map(school =&gt; {
      const schoolVenues = venues.filter(venue =&gt; venue.school === school);
      const buildings = schoolVenues.filter(venue =&gt; venue.type === &#39;BUILDING&#39;);
      const playgrounds = schoolVenues.filter(venue =&gt; venue.type === &#39;PLAYGROUND&#39;);
      const profile = schoolAreaProfiles[school];
      const profileArea = key =&gt; profile &amp;&amp; Number.isFinite(Number(profile[key])) ? Number(profile[key]) : null;
      return {
        school,
        totalArea: profileArea(&#39;totalArea&#39;),
        leasedArea: profileArea(&#39;leasedArea&#39;),
        ownedArea: profileArea(&#39;ownedArea&#39;),
        buildingCount: buildings.length,
        buildingArea: buildings.reduce((sum, venue) =&gt; sum + (Number(venue.area) || 0), 0),
        playgroundCount: playgrounds.length,
        playgroundArea: playgrounds.reduce((sum, venue) =&gt; sum + (Number(venue.area) || 0), 0)

  }

  const xlsxUint16 = value =&gt; new Uint8Array([value &amp; 255, (value &gt;&gt;&gt; 8) &amp; 255]);
  const xlsxUint32 = value =&gt; new Uint8Array([value &amp; 255, (value &gt;&gt;&gt; 8) &amp; 255, (value &gt;&gt;&gt; 16) &amp; 255, (value &gt;&gt;&gt; 24) &amp; 255]);
  const mergeXlsxBytes = chunks =&gt; {
    const output = new Uint8Array(chunks.reduce((sum, chunk) =&gt; sum + chunk.length, 0));

    chunks.forEach(chunk =&gt; { output.set(chunk, offset); offset += chunk.length; });

    let crc = 0xffffffff;
    bytes.forEach(byte =&gt; { crc = xlsxCrcTable[(crc ^ byte) &amp; 255] ^ (crc &gt;&gt;&gt; 8); });

  };

  function createXlsxZip(files) {
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let localOffset = 0;
    const now = new Date();
    const dosTime = (now.getHours() &lt;&lt; 11) | (now.getMinutes() &lt;&lt; 5) | Math.floor(now.getSeconds() / 2);
    const dosDate = ((now.getFullYear() - 1980) &lt;&lt; 9) | ((now.getMonth() + 1) &lt;&lt; 5) | now.getDate();
    files.forEach(file =&gt; {
      const name = encoder.encode(file.name);
      const data = typeof file.content === &#39;string&#39; ? encoder.encode(file.content) : file.content;
      const crc = xlsxCrc32(data);
      const localHeader = mergeXlsxBytes([xlsxUint32(0x04034b50), xlsxUint16(20), xlsxUint16(0x0800), xlsxUint16(0), xlsxUint16(dosTime), xlsxUint16(dosDate), xlsxUint32(crc), xlsxUint32(data.length), xlsxUint32(data.length), xlsxUint16(name.length), xlsxUint16(0), name]);
      localParts.push(localHeader, data);
      centralParts.push(mergeXlsxBytes([xlsxUint32(0x02014b50), xlsxUint16(20), xlsxUint16(20), xlsxUint16(0x0800), xlsxUint16(0), xlsxUint16(dosTime), xlsxUint16(dosDate), xlsxUint32(crc), xlsxUint32(data.length), xlsxUint32(data.length), xlsxUint16(name.length), xlsxUint16(0), xlsxUint16(0), xlsxUint16(0), xlsxUint16(0), xlsxUint32(0), xlsxUint32(localOffset), name]));
      localOffset += localHeader.length + data.length;
    });
    const centralDirectory = mergeXlsxBytes(centralParts);
    const end = mergeXlsxBytes([xlsxUint32(0x06054b50), xlsxUint16(0), xlsxUint16(0), xlsxUint16(files.length), xlsxUint16(files.length), xlsxUint32(centralDirectory.length), xlsxUint32(localOffset), xlsxUint16(0)]);
    return mergeXlsxBytes([...localParts, centralDirectory, end]);
  }

  function buildSchoolStatisticsXlsx(rows) {
    const xmlEscape = value =&gt; new XMLSerializer().serializeToString(document.createTextNode(String(value)));
    const columnName = index =&gt; String.fromCharCode(65 + index);
    const textCell = (value, column, row) =&gt; `&lt;c r=&quot;${column}${row}&quot; t=&quot;inlineStr&quot;&gt;&lt;is&gt;&lt;t&gt;${xmlEscape(value)}&lt;/t&gt;&lt;/is&gt;&lt;/c&gt;`;
    const numberCell = (value, column, row) =&gt; value === null ? &#39;&#39; : `&lt;c r=&quot;${column}${row}&quot; s=&quot;1&quot;&gt;&lt;v&gt;${Number(value)}&lt;/v&gt;&lt;/c&gt;`;
    const headerXml = schoolStatisticsHeaders.map((header, index) =&gt; textCell(header, columnName(index), 1)).join(&#39;&#39;);
    const rowXml = rows.map((item, index) =&gt; {
      const rowNumber = index + 2;
      const values = [item.school, item.totalArea, item.leasedArea, item.ownedArea, item.buildingCount, item.buildingArea, item.playgroundCount, item.playgroundArea];
      return `&lt;row r=&quot;${rowNumber}&quot;&gt;${values.map((value, columnIndex) =&gt; columnIndex === 0 ? textCell(value, columnName(columnIndex), rowNumber) : numberCell(value, columnName(columnIndex), rowNumber)).join(&#39;&#39;)}&lt;/row&gt;`;
    }).join(&#39;&#39;);
    const worksheet = `&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot; standalone=&quot;yes&quot;?&gt;&lt;worksheet xmlns=&quot;http://schemas.openxmlformats.org/spreadsheetml/2006/main&quot;&gt;&lt;dimension ref=&quot;A1:H${rows.length + 1}&quot;/&gt;&lt;sheetViews&gt;&lt;sheetView workbookViewId=&quot;0&quot;&gt;&lt;pane ySplit=&quot;1&quot; topLeftCell=&quot;A2&quot; activePane=&quot;bottomLeft&quot; state=&quot;frozen&quot;/&gt;&lt;/sheetView&gt;&lt;/sheetViews&gt;&lt;cols&gt;&lt;col min=&quot;1&quot; max=&quot;1&quot; width=&quot;26&quot; customWidth=&quot;1&quot;/&gt;&lt;col min=&quot;2&quot; max=&quot;8&quot; width=&quot;18&quot; customWidth=&quot;1&quot;/&gt;&lt;/cols&gt;&lt;sheetData&gt;&lt;row r=&quot;1&quot;&gt;${headerXml}&lt;/row&gt;${rowXml}&lt;/sheetData&gt;&lt;autoFilter ref=&quot;A1:H${rows.length + 1}&quot;/&gt;&lt;/worksheet&gt;`;
    const files = [
      { name: &#39;[Content_Types].xml&#39;, content: `&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;&lt;Types xmlns=&quot;http://schemas.openxmlformats.org/package/2006/content-types&quot;&gt;&lt;Default Extension=&quot;rels&quot; ContentType=&quot;application/vnd.openxmlformats-package.relationships+xml&quot;/&gt;&lt;Default Extension=&quot;xml&quot; ContentType=&quot;application/xml&quot;/&gt;&lt;Override PartName=&quot;/xl/workbook.xml&quot; ContentType=&quot;application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml&quot;/&gt;&lt;Override PartName=&quot;/xl/worksheets/sheet1.xml&quot; ContentType=&quot;application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml&quot;/&gt;&lt;Override PartName=&quot;/xl/styles.xml&quot; ContentType=&quot;application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml&quot;/&gt;&lt;/Types&gt;` },
      { name: &#39;_rels/.rels&#39;, content: `&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;&lt;Relationships xmlns=&quot;http://schemas.openxmlformats.org/package/2006/relationships&quot;&gt;&lt;Relationship Id=&quot;rId1&quot; Type=&quot;http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument&quot; Target=&quot;xl/workbook.xml&quot;/&gt;&lt;/Relationships&gt;` },
      { name: &#39;xl/workbook.xml&#39;, content: `&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;&lt;workbook xmlns=&quot;http://schemas.openxmlformats.org/spreadsheetml/2006/main&quot; xmlns:r=&quot;http://schemas.openxmlformats.org/officeDocument/2006/relationships&quot;&gt;&lt;sheets&gt;&lt;sheet name=&quot;学校统计&quot; sheetId=&quot;1&quot; r:id=&quot;rId1&quot;/&gt;&lt;/sheets&gt;&lt;/workbook&gt;` },
      { name: &#39;xl/_rels/workbook.xml.rels&#39;, content: `&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;&lt;Relationships xmlns=&quot;http://schemas.openxmlformats.org/package/2006/relationships&quot;&gt;&lt;Relationship Id=&quot;rId1&quot; Type=&quot;http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet&quot; Target=&quot;worksheets/sheet1.xml&quot;/&gt;&lt;Relationship Id=&quot;rId2&quot; Type=&quot;http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles&quot; Target=&quot;styles.xml&quot;/&gt;&lt;/Relationships&gt;` },
      { name: &#39;xl/styles.xml&#39;, content: `&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;&lt;styleSheet xmlns=&quot;http://schemas.openxmlformats.org/spreadsheetml/2006/main&quot;&gt;&lt;numFmts count=&quot;1&quot;&gt;&lt;numFmt numFmtId=&quot;164&quot; formatCode=&quot;0.##&quot;/&gt;&lt;/numFmts&gt;&lt;fonts count=&quot;1&quot;&gt;&lt;font&gt;&lt;sz val=&quot;11&quot;/&gt;&lt;name val=&quot;等线&quot;/&gt;&lt;/font&gt;&lt;/fonts&gt;&lt;fills count=&quot;1&quot;&gt;&lt;fill&gt;&lt;patternFill patternType=&quot;none&quot;/&gt;&lt;/fill&gt;&lt;/fills&gt;&lt;borders count=&quot;1&quot;&gt;&lt;border/&gt;&lt;/borders&gt;&lt;cellStyleXfs count=&quot;1&quot;&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;0&quot; fillId=&quot;0&quot; borderId=&quot;0&quot;/&gt;&lt;/cellStyleXfs&gt;&lt;cellXfs count=&quot;2&quot;&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;0&quot; fillId=&quot;0&quot; borderId=&quot;0&quot; xfId=&quot;0&quot;/&gt;&lt;xf numFmtId=&quot;164&quot; fontId=&quot;0&quot; fillId=&quot;0&quot; borderId=&quot;0&quot; xfId=&quot;0&quot; applyNumberFormat=&quot;1&quot;/&gt;&lt;/cellXfs&gt;&lt;/styleSheet&gt;` },

  function renderSchoolStatistics() {

    const keyword = state.schoolStatsKeyword.trim();
    const pageCount = Math.max(1, Math.ceil(rows.length / schoolStatisticsPageSize));

    const displayRow = item =&gt; [item.school, item.totalArea === null ? &#39;—&#39; : `${format(item.totalArea)}㎡`, item.leasedArea === null ? &#39;—&#39; : `${format(item.leasedArea)}㎡`, item.ownedArea === null ? &#39;—&#39; : `${format(item.ownedArea)}㎡`, `${item.buildingCount}栋`, `${format(item.buildingArea)}㎡`, `${item.playgroundCount}个`, `${format(item.playgroundArea)}㎡`];
    const pageButtons = Array.from({ length: pageCount }, (_, index) =&gt; index + 1).map(page =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn ${page === state.schoolStatsPage ? &#39;btn-primary &#39; : &#39;&#39;}page-button&quot; data-school-stats-page=&quot;${page}&quot;${page === state.schoolStatsPage ? &#39; aria-current=&quot;page&quot;&#39; : &#39;&#39;}&gt;${page}&lt;/button&gt;`).join(&#39;&#39;);
    const pagination = rows.length ? `&lt;div class=&quot;list-footer&quot; data-school-statistics-pagination&gt;&lt;span class=&quot;filter-summary&quot;&gt;共 ${rows.length} 所学校，每页 ${schoolStatisticsPageSize} 所&lt;/span&gt;&lt;div class=&quot;pagination&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn page-button&quot; data-school-stats-page=&quot;${state.schoolStatsPage - 1}&quot; aria-label=&quot;上一页&quot;${state.schoolStatsPage === 1 ? &#39; disabled&#39; : &#39;&#39;}&gt;‹&lt;/button&gt;${pageButtons}&lt;button type=&quot;button&quot; class=&quot;btn page-button&quot; data-school-stats-page=&quot;${state.schoolStatsPage + 1}&quot; aria-label=&quot;下一页&quot;${state.schoolStatsPage === pageCount ? &#39; disabled&#39; : &#39;&#39;}&gt;›&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;` : &#39;&#39;;
    const table = rows.length ? `&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot; data-school-statistics-table&gt;&lt;thead&gt;&lt;tr&gt;${schoolStatisticsHeaders.map(header =&gt; `&lt;th class=&quot;${header === &#39;学校名称&#39; ? &#39;&#39; : &#39;text-end&#39;}&quot;&gt;${header}&lt;/th&gt;`).join(&#39;&#39;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${pageRows.map(item =&gt; `&lt;tr&gt;${displayRow(item).map((cell, index) =&gt; `&lt;td class=&quot;${index ? &#39;text-end&#39; : &#39;&#39;}&quot;&gt;${cell}&lt;/td&gt;`).join(&#39;&#39;)}&lt;/tr&gt;`).join(&#39;&#39;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;${pagination}` : `&lt;div class=&quot;empty-state&quot;&gt;${icon(&#39;inbox&#39;)}&lt;p&gt;暂无符合条件的学校&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-reset-school-statistics&gt;清空筛选&lt;/button&gt;&lt;/div&gt;`;
    const exportButton = `&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-export-school-statistics${rows.length ? &#39;&#39; : &#39; disabled&#39;}&gt;${icon(&#39;download&#39;)} 导出&lt;/button&gt;`;
    content.innerHTML = heading(&#39;学校统计&#39;, &#39;&#39;, exportButton) + `&lt;section class=&quot;card list-card&quot;&gt;&lt;div class=&quot;toolbar&quot;&gt;&lt;div class=&quot;toolbar-group&quot;&gt;&lt;input class=&quot;form-control&quot; id=&quot;school-statistics-search&quot; aria-label=&quot;按学校名称筛选&quot; placeholder=&quot;输入学校名称筛选&quot; value=&quot;${state.schoolStatsKeyword}&quot;&gt;${keyword ? &#39;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-reset-school-statistics&gt;重置筛选&lt;/button&gt;&#39; : &#39;&#39;}&lt;/div&gt;&lt;/div&gt;${table}&lt;/section&gt;`;
  }

  function renderAudit() {
    const schoolAreaAudit = Object.values(schoolAreaProfiles).filter(profile =&gt; state.portal === &#39;bureau&#39; || profile.school === &#39;海淀区实验中学&#39;).flatMap(profile =&gt; Array.isArray(profile.auditLogs) ? profile.auditLogs : []);
    const rows = [...schoolAreaAudit, ...venues.flatMap(venue =&gt; Array.isArray(venue.playgroundAudit) ? venue.playgroundAudit : []),
      [&#39;更新建筑档案&#39;,&#39;致远教学楼&#39;, state.portal === &#39;school&#39; ? &#39;张老师&#39; : &#39;张老师&#39;,&#39;2026-07-20 16:35&#39;],
      [&#39;新增专项设施&#39;,&#39;主楼屋面防水&#39;, state.portal === &#39;school&#39; ? &#39;张老师&#39; : &#39;张老师&#39;,&#39;2026-07-20 15:18&#39;],

  function facilitySummary(facility) {
    const structuredDetails = facility.type === &#39;门&#39;
      ? [facility.doorType, facility.doorLocation, facility.doorCount ? `${facility.doorCount}樘` : &#39;&#39;, facility.doorHardwareStatus]
      : facility.type === &#39;窗&#39;
        ? [facility.windowType, facility.frameMaterial, facility.glassType, facility.windowLocation, facility.windowCount ? `${facility.windowCount}樘` : &#39;&#39;, facility.windowHardwareStatus, facility.windowSealingPerformance]
      : facility.type === &#39;防水&#39;
        ? [facility.roofType, facility.waterproofLocation, facility.waterproofMaterial, facility.waterproofGrade, facility.waterproofArea ? `${facility.waterproofArea}㎡` : &#39;&#39;]
        : facility.type === &#39;外墙&#39;
          ? [facility.exteriorLocation, facility.facadeMaterial, facility.insulationType, facility.insulationMaterial, facility.insulationThickness ? `${facility.insulationThickness}mm` : &#39;&#39;]
          : facility.type === &#39;内墙&#39;
            ? [facility.interiorLocation, facility.interiorSpaceType, facility.interiorWallType, facility.interiorBaseMaterial, facility.interiorFinishMaterial]
            : facility.type === &#39;卫生间&#39;
              ? [facility.sanitaryLocation, facility.sanitaryType, facility.fixtureType, facility.sanitaryArea ? `${facility.sanitaryArea}㎡` : &#39;&#39;]
              : facility.type === &#39;浴室&#39;
                ? [facility.bathroomLocation, facility.bathroomType, facility.showerCount ? `${facility.showerCount}个淋浴位` : &#39;&#39;, facility.bathroomArea ? `${facility.bathroomArea}㎡` : &#39;&#39;]
                : facility.type === &#39;消防设施&#39;
                  ? [facility.fireCategory, facility.fireLocation, facility.fireQuantity ? `${facility.fireQuantity}${facility.fireUnit || &#39;&#39;}` : facility.fireUnit]
        : [];
    return [...structuredDetails, facility.year ? `最近改造 ${facility.year}年` : &#39;&#39;, facility.detail].filter(Boolean).join(&#39;；&#39;);
  }

  function savePlaygroundModule() {
    const venue = venues.find(item =&gt; item.id === state.selectedVenue &amp;&amp; item.type === &#39;PLAYGROUND&#39;);
    if (!venue || state.portal === &#39;bureau&#39;) return;
    const moduleId = document.getElementById(&#39;playground-module-id&#39;).value;
    const type = document.getElementById(&#39;playground-module-type&#39;).value;
    const name = document.getElementById(&#39;playground-module-name&#39;).value.trim();
    const areaText = document.getElementById(&#39;playground-module-area&#39;).value.trim();
    const material = document.getElementById(&#39;playground-module-material&#39;).value;
    const customMaterial = document.getElementById(&#39;playground-module-custom-material&#39;).value.trim();
    const builtYearText = document.getElementById(&#39;playground-module-built-year&#39;).value.trim();
    const renovatedYearText = document.getElementById(&#39;playground-module-renovated-year&#39;).value.trim();
    const currentYear = new Date().getFullYear();

  function saveFacilityRecord() {
    const name = document.getElementById(&#39;facility-name&#39;).value.trim();
    const detail = document.getElementById(&#39;facility-detail&#39;).value.trim();
    const error = document.getElementById(&#39;facility-error&#39;);
    if (!name) { error.textContent = &#39;请填写档案名称。&#39;; error.hidden = false; return; }
    const type = document.getElementById(&#39;facility-type&#39;).value;
    const isDoor = type === &#39;门&#39;;
    const isWindow = type === &#39;窗&#39;;
    const isWaterproof = type === &#39;防水&#39;;
    const isExteriorWall = type === &#39;外墙&#39;;
    const isInteriorWall = type === &#39;内墙&#39;;
    const isSanitaryRoom = type === &#39;卫生间&#39;;
    const isBathroom = type === &#39;浴室&#39;;
    const isFireFacility = type === &#39;消防设施&#39;;
    const yearText = document.getElementById(&#39;facility-year&#39;).value.trim();
    const currentYear = new Date().getFullYear();
    if (yearText &amp;&amp; (!Number.isInteger(Number(yearText)) || Number(yearText) &lt; 1900 || Number(yearText) &gt; currentYear + 1)) {
      error.textContent = `最近改造年份请输入 1900—${currentYear + 1} 的四位整数。`;
      error.hidden = false;
      return;
    }
    const locationFields = [
      [isDoor, &#39;facility-door-location&#39;, &#39;门所在位置&#39;], [isWindow, &#39;facility-window-location&#39;, &#39;窗所在位置&#39;],
      [isExteriorWall, &#39;facility-exterior-location&#39;, &#39;外墙所在位置&#39;], [isInteriorWall, &#39;facility-interior-location&#39;, &#39;内墙所在位置&#39;],
      [isSanitaryRoom, &#39;facility-sanitary-location&#39;, &#39;卫生间所在位置&#39;], [isBathroom, &#39;facility-bathroom-location&#39;, &#39;浴室所在位置&#39;],
      [isFireFacility, &#39;facility-fire-location&#39;, &#39;消防设施设置位置&#39;]
    ];
    const invalidLocation = locationFields.find(([active, id]) =&gt; active &amp;&amp; document.getElementById(id).value.trim().length &gt; 100);
    if (invalidLocation) { error.textContent = `${invalidLocation[2]}不能超过 100 个字符。`; error.hidden = false; return; }
    const validatePositiveInteger = (active, id, label, maximum = Number.MAX_SAFE_INTEGER) =&gt; {

<script id="versioned-workbench-router-v1">
(() => {
  const frame = document.querySelector('iframe');
  if (!frame) return;
  const parameters = new URLSearchParams(location.search);
  const portalParameter = parameters.get('portal');
  const requestedView = parameters.get('view');
  const portal = portalParameter === 'bureau' ? 'bureau' : 'school';
  const shouldOpenProject = requestedView === 'project' || (!requestedView && Boolean(portalParameter));
  const projectUrl = targetPortal => {
    const url = new URL('./project.html', location.href);
    url.searchParams.set('portal', targetPortal === 'bureau' ? 'bureau' : 'school');
    return url.href;
  };
  const workbenchUrl = targetPortal => {
    const url = new URL('./app.html', location.href);
    url.searchParams.set('view', 'workbench');
    url.searchParams.set('portal', targetPortal === 'bureau' ? 'bureau' : 'school');
    return url.href;
  };
  if (shouldOpenProject) {
    location.replace(projectUrl(portal));
    return;
  }
  let activePortal = portal;
  let ready = false;
  const reveal = () => {
    frame.contentWindow?.postMessage({ type: 'set-portal', portal: activePortal }, '*');
    if (!ready) {
      ready = true;
      requestAnimationFrame(() => document.body.classList.add('route-ready'));
    }
  };
  frame.addEventListener('load', reveal);
  if (frame.contentDocument?.readyState === 'complete' || frame.contentDocument?.readyState === 'interactive') reveal();
  setTimeout(reveal, 0);
  setTimeout(reveal, 120);
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow) return;
    if (event.data?.type === 'open-project-management') {
      activePortal = event.data.portal === 'bureau' ? 'bureau' : 'school';
      location.assign(projectUrl(activePortal));
      return;
    }
    if (event.data?.type === 'project-back') {
      activePortal = event.data.portal === 'bureau' ? 'bureau' : 'school';
      location.assign(workbenchUrl(activePortal));
    }
  });
})();
</script>

    function enhance(){
      const head=doc.querySelector('.page-heading');if(head&&!head.dataset.venueDocEnhanced){const title=head.querySelector('h2')?.textContent.trim()||'建筑物管理',type=typeOf(title),action=head.lastElementChild||head;action.append(dots(title,type,true));head.dataset.venueDocEnhanced='1'}
      doc.querySelectorAll('.modal-panel,.modal').forEach(m=>{if(m.dataset.venueDocEnhanced||m.closest('[data-venue-doc]'))return;const h=m.querySelector('.modal-head');if(!h)return;const title=h.querySelector('strong,h2')?.textContent.trim()||'建筑物业务弹窗',type=typeOf(title),close=h.querySelector('button:last-child'),g=dots(title,type,false);close?h.insertBefore(g,close):h.append(g);m.dataset.venueDocEnhanced='1'});
      constraints();
    }
    const appWindow=app.ownerDocument?.defaultView;
    appWindow?.__venueEnhancerRuntime?.dispose?.();
    let enhanceQueued=false,enhanceDisposed=false,enhanceFrame=0;
    const scheduleEnhance=()=>{if(enhanceQueued||enhanceDisposed)return;enhanceQueued=true;enhanceFrame=appWindow?.requestAnimationFrame(()=>{enhanceFrame=0;enhanceQueued=false;if(!enhanceDisposed)enhance()})||0};
    const enhanceEvents=['click','change','input'];
    enhanceEvents.forEach(type=>doc.addEventListener(type,scheduleEnhance,true));
    const disposeEnhance=()=>{enhanceDisposed=true;enhanceEvents.forEach(type=>doc.removeEventListener(type,scheduleEnhance,true));if(enhanceFrame)appWindow?.cancelAnimationFrame(enhanceFrame);enhanceFrame=0};
    if(appWindow){appWindow.__venueEnhancerRuntime={dispose:disposeEnhance};appWindow.addEventListener('pagehide',disposeEnhance,{once:true})}
    enhance();
  }
  const scheduleInstall=()=>setTimeout(install,0);
  frame.addEventListener('load',scheduleInstall);
  scheduleInstall();
})();
</script>
</body>
</html>
